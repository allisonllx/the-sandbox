<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Hard Neo-Brutalist Outer Shadow Canvas -->
  <rect x="16" y="16" width="476" height="476" rx="40" fill="#1E272E" />
  <!-- Main Playground Canvas Base -->
  <rect x="8" y="8" width="476" height="476" rx="40" fill="#FFF9E6" stroke="#1E272E" stroke-width="8" />

  <!-- The Sandy Base inside the Sandbox -->
  <path d="M 8 410 Q 250 370 484 410 L 484 476 L 8 476 Z" fill="#FFEAA7" stroke="#1E272E" stroke-width="8" stroke-linejoin="round" />

  <!-- ========================================== -->
  <!-- COLORFUL FLOATING BLOCKS (MANUAL SHADOWS) -->
  <!-- ========================================== -->

  <!-- Mint Green Bracket Box -->
  <!-- Hard Shadow Layer -->
  <rect x="108" y="158" width="60" height="60" rx="16" fill="#1E272E" />
  <!-- Colored Top Layer -->
  <rect x="100" y="150" width="60" height="60" rx="16" fill="#55E6C1" stroke="#1E272E" stroke-width="6"/>
  <text x="120" y="194" font-family="monospace" font-size="42" font-weight="900" fill="#1E272E">{</text>

  <!-- Sunny Yellow Closing Bracket Box -->
  <!-- Hard Shadow Layer -->
  <rect x="348" y="128" width="60" height="60" rx="16" fill="#1E272E" />
  <!-- Colored Top Layer -->
  <rect x="340" y="120" width="60" height="60" rx="16" fill="#FEA47F" stroke="#1E272E" stroke-width="6"/>
  <text x="360" y="164" font-family="monospace" font-size="42" font-weight="900" fill="#1E272E">}</text>

  <!-- Electric Blue Code Tag Box -->
  <!-- Hard Shadow Layer -->
  <rect x="228" y="88" width="85" height="50" rx="12" fill="#1E272E" />
  <!-- Colored Top Layer -->
  <rect x="220" y="80" width="85" height="50" rx="12" fill="#25CCF7" stroke="#1E272E" stroke-width="6"/>
  <text x="230" y="114" font-family="monospace" font-size="22" font-weight="900" fill="#1E272E">&lt;/&gt;</text>


  <!-- ========================================== -->
  <!-- THE CUTE BUCKET & SHOVEL ASSEMBLY         -->
  <!-- ========================================== -->

  <!-- Bucket Handle Components -->
  <path d="M 160 280 C 160 160, 340 160, 340 280" fill="none" stroke="#1E272E" stroke-width="8" stroke-linecap="round" />
  
  <!-- Hard Shadow Layer for Bucket Body -->
  <polygon points="178,278 338,278 308,428 208,428" fill="#1E272E" stroke="#1E272E" stroke-width="4" stroke-linejoin="round" />
  <!-- Main Pastel Red Bucket Body -->
  <polygon points="170,270 330,270 300,420 200,420" fill="#FF7675" stroke="#1E272E" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Cute Character Face Detail -->
  <circle cx="230" cy="330" r="8" fill="#1E272E" />
  <circle cx="270" cy="330" r="8" fill="#1E272E" />
  <path d="M 242 348 Q 250 358 258 348" fill="none" stroke="#1E272E" stroke-width="6" stroke-linecap="round" />
  
  <!-- Blushing Cheeks -->
  <circle cx="214" cy="342" r="8" fill="#FF8787" opacity="0.7" />
  <circle cx="286" cy="342" r="8" fill="#FF8787" opacity="0.7" />

  <!-- Playful Shovel Leaning on Right Side -->
  <!-- Shovel Group Hard Shadow Component -->
  <g transform="translate(296, 246) rotate(25)">
    <rect x="25" y="0" width="14" height="120" fill="#1E272E" rx="4" />
    <circle cx="32" cy="12" r="16" fill="none" stroke="#1E272E" stroke-width="6" />
    <path d="M 0 110 L 64 110 L 54 170 L 10 170 Z" fill="#1E272E" stroke="#1E272E" stroke-width="6" stroke-linejoin="round" />
  </g>
  <!-- Shovel Group Main Colored Component -->
  <g transform="translate(290, 240) rotate(25)">
    <rect x="25" y="0" width="14" height="120" fill="#BDC581" stroke="#1E272E" stroke-width="6" rx="4" />
    <circle cx="32" cy="12" r="16" fill="none" stroke="#1E272E" stroke-width="6" />
    <path d="M 0 110 L 64 110 L 54 170 L 10 170 Z" fill="#EAB543" stroke="#1E272E" stroke-width="6" stroke-linejoin="round" />
  </g>


  <!-- ========================================== -->
  <!-- DECORATIVE PLAYGROUND SPARKLES             -->
  <!-- ========================================== -->
  <!-- Left Side Star Shadow + Base -->
  <path d="M 124 76 L 128 89 L 141 89 L 131 97 L 134 110 L 124 102 L 114 110 L 117 97 L 107 89 L 120 89 Z" fill="#1E272E" />
  <path d="M 120 72 L 124 85 L 137 85 L 127 93 L 130 106 L 120 98 L 110 106 L 113 93 L 103 85 L 116 85 Z" fill="#FFF200" stroke="#1E272E" stroke-width="4" />

  <!-- Right Side Star Shadow + Base -->
  <path d="M 394 264 L 397 274 L 407 274 L 399 281 L 401 292 L 394 285 L 387 292 L 389 281 L 381 274 L 391 274 Z" fill="#1E272E" />
  <path d="M 390 260 L 393 270 L 403 270 L 395 277 L 397 288 L 390 281 L 383 288 L 385 277 L 377 270 L 387 270 Z" fill="#FFF200" stroke="#1E272E" stroke-width="4" />
</svg>
