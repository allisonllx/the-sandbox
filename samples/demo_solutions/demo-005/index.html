<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LockerShare — Equipment Discovery</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>LockerShare</h1>
    <p class="subtitle">Local equipment discovery — starter prototype</p>
  </header>
  <main class="layout">
    <section id="merchant-list" class="panel" aria-label="Inventory nearby"></section>
    <aside id="cart-drawer" class="panel cart" aria-label="Cart">
      <h2>Cart</h2>
      <ul id="cart-items"></ul>
      <p id="cart-total">Total: $0.00</p>
      <button id="checkout-btn" type="button" disabled>Checkout</button>
    </aside>
  </main>
  <script src="src/app.js"></script>
</body>
</html>
